[project]
name = "neurosymbolic-llm"
version = "0.1.0"
description = "Neurosymbolic approach to improving rule-based reasoning in LLMs"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Core ML/Scientific Computing
    "torch>=2.4.1",
    "numpy>=1.24.4,<2.0.0",
    "scipy>=1.10.1",
    "scikit-learn>=1.3.2",
    # LLM & Tokenization
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
    "fairscale>=0.4.13",
    # Data & Utilities
    "pandas>=2.0.3",
    "pyyaml>=6.0.2",
    "fire>=0.7.0",
    "tqdm>=4.67.1",
    "pydantic>=2.10.6",
    # Math & Symbolic
    "sympy>=1.13.3",
    "num2words>=0.5.14",
    "word2number>=1.1",
    "nengo>=4.0.0",
    # Visualization
    "matplotlib>=3.7.5",
    "seaborn>=0.13.2",
    "plotly>=6.0.1",
    # Jupyter & Notebooks
    "ipython",
    "ipykernel",
    "jupyter",
    "notebook",
    "nbconvert>=7.16.6",
    "nbformat>=5.10.4",
    # Experiment Tracking
    "wandb>=0.19.8",
    # Misc
    "requests>=2.32.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llama"]

[dependency-groups]
dev = []
